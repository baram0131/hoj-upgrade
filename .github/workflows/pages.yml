name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve original source and apply upgrade
        if: hashFiles('UPGRADE.md') == ''
        run: |
          git init "$RUNNER_TEMP/original"
          git -C "$RUNNER_TEMP/original" fetch --depth 1 https://github.com/dev-jihoon/hoj.git 53d71d8c5386a62f7078766860585ba29f45ddb6
          git -C "$RUNNER_TEMP/original" checkout --detach FETCH_HEAD
          rsync -a --ignore-existing --exclude=.git --exclude=.github "$RUNNER_TEMP/original/" ./
          python - <<'PY'
          from pathlib import Path
          import json
          files=json.loads(r'''{"js/quick-start.js":"(() => {\n  const KEY=\"hoj_quick_start_seen_v1\";\n  const style=document.createElement(\"style\");\n  style.textContent=`.hoj-quick-btn{position:fixed;right:18px;bottom:18px;z-index:9999;border:1px solid #00639f;background:#0076c0;color:#fff;padding:10px 14px;font:700 14px/1.2 sans-serif;box-shadow:0 4px 14px #0002;cursor:pointer}.hoj-guide{width:min(560px,calc(100% - 36px));border:1px solid #ddd;padding:24px;color:#333;font:14px/1.65 sans-serif}.hoj-guide::backdrop{background:#0006}.hoj-guide h2{margin:0 0 8px;font-size:22px}.hoj-guide li{margin:6px 0}.hoj-guide-actions{display:flex;gap:8px;justify-content:flex-end}.hoj-guide button{padding:8px 14px;border:1px solid #ccc;background:#fff;cursor:pointer;font:inherit}.hoj-guide .primary{background:#0076c0;color:#fff}.hoj-runtime-state{position:fixed;left:18px;bottom:18px;z-index:9998;background:#fff;border:1px solid #ddd;padding:8px 11px;color:#555;font:12px/1.4 sans-serif;display:none}@media(max-width:640px){.hoj-quick-btn{right:10px;bottom:10px}.hoj-runtime-state{left:10px;bottom:58px}}`;\n  document.head.appendChild(style);\n  const btn=document.createElement(\"button\");\n  btn.className=\"hoj-quick-btn\";btn.type=\"button\";btn.textContent=\"빠른 시작\";\n  const guide=document.createElement(\"dialog\");guide.className=\"hoj-guide\";guide.setAttribute(\"aria-label\",\"HOJ 빠른 시작\");\n  guide.innerHTML='<h2>HOJ 빠른 시작</h2><p>아래 순서로 Python 코드를 실행하고 채점해 보세요.</p><ol><li><b>문제집</b>에서 연습 문제를 선택합니다.</li><li>IDLE 편집기에 코드를 작성합니다.</li><li><b>F5 실행</b>으로 결과를 확인합니다.</li><li><b>제출</b>을 눌러 출력과 문제 조건을 함께 채점합니다.</li><li>채점 결과를 보고 코드를 수정해 다시 제출합니다.</li></ol><div class=\"hoj-guide-actions\"><button type=\"button\" data-close>닫기</button><button type=\"button\" class=\"primary\" data-go>문제집 보기</button></div>';\n  document.body.append(btn,guide);\n  function show(){if(!guide.open)guide.showModal();try{localStorage.setItem(KEY,\"1\");}catch{}}\n  btn.addEventListener(\"click\",show);\n  guide.querySelector(\"[data-close]\").onclick=()=>guide.close();\n  guide.querySelector(\"[data-go]\").onclick=()=>{location.hash=\"#/\";guide.close();};\n  const runtime=document.createElement(\"div\");runtime.className=\"hoj-runtime-state\";runtime.setAttribute(\"role\",\"status\");runtime.textContent=\"Python 실행환경을 준비하고 있습니다…\";document.body.appendChild(runtime);\n  const update=()=>{runtime.style.display=[...document.querySelectorAll(\".sh-out\")].some(el=>el.textContent.trim()===\"Python을 불러오는 중입니다...\")?\"block\":\"none\";};\n  new MutationObserver(update).observe(document.getElementById(\"main\"),{subtree:true,childList:true,characterData:true});\n  update();let seen=false;try{seen=!!localStorage.getItem(KEY);}catch{}if(!seen)setTimeout(show,700);\n})();","UPGRADE.md":"# HOJ 업그레이드\n\n원작: https://github.com/dev-jihoon/hoj\n기준 커밋: 53d71d8c5386a62f7078766860585ba29f45ddb6\n\n빠른 시작과 Python 실행환경 로딩 안내만 추가했습니다. Python/Pyodide, IDLE, 채점기, 문제 데이터는 원본 그대로입니다. 원본 저장소와 기존 배포는 변경하지 않습니다.\n"}''')
          for name,text in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='<script type="module" src="js/app.js"></script>'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+'\n<script src="js/quick-start.js"></script>'),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: preserve original app and apply minimal upgrade"
          git push origin HEAD:main
      - name: Test original Python runner
        run: python3 tests/test_runner.py
      - name: Validate original problems
        run: python3 tools/build.py --check
      - name: Download bundled Python runtime
        run: |
          curl --fail --retry 3 -sSL -o core.tar.bz2 "https://github.com/pyodide/pyodide/releases/download/0.27.2/pyodide-core-0.27.2.tar.bz2"
          tar xjf core.tar.bz2
      - name: Build original static site
        run: python3 tools/dist.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
